<!DOCTYPE html>

<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>
    AR Face Magic Studio
  </title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js">
  </script>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: #f4f0ff;
      color: #292043;
      font-family: Arial, 'Noto Sans JP', sans-serif
    }

    header {
      padding: 22px 32px;
      color: white;
      background: linear-gradient(110deg, #883ff0, #4777ec);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px
    }

    h1 {
      font-size: 27px;
      margin: 0 0 6px
    }

    header p {
      margin: 0
    }

    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 18px;
      padding: 20px;
      max-width: 1450px;
      margin: auto
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #4b329b15
    }

    .panel h2 {
      font-size: 18px;
      margin: 0 0 18px
    }

    .filter-btn {
      width: 100%;
      padding: 14px;
      text-align: left;
      background: #faf9ff;
      border: 1px solid #e1d7f8;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 16px
    }

    .filter-btn.active {
      border-color: #8446ed;
      background: #eadcff
    }

    .camera-panel {
      min-width: 0
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 4px solid white;
      border-radius: 22px;
      background: #171321;
      overflow: hidden;
      box-shadow: 0 10px 30px #4b329b25;
      isolation: isolate
    }

    .camera-box a-scene {
      position: absolute !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 2;
      background: transparent !important
    }

    .camera-box .camera-label {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: #2b1b4bbb;
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      pointer-events: none
    }

    .camera-box video.ar-camera-video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 1 !important;
      pointer-events: none
    }

    .camera-box canvas {
      background: transparent !important
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 20px 0
    }

    .action-btn {
      border: 0;
      border-radius: 12px;
      background: linear-gradient(110deg, #a052ff, #6532dd);
      color: white;
      font-weight: bold;
      padding: 13px 17px;
      cursor: pointer
    }

    .action-btn:disabled {
      opacity: .6;
      cursor: wait
    }

    .color-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #ccc;
      cursor: pointer
    }

    .color-btn.active {
      box-shadow: 0 0 0 3px #8044ee
    }

    input[type=range] {
      width: 100%;
      accent-color: #8444ee
    }

    .move-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .move-controls button {
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #e8d9ff;
      color: #4e2c9c;
      font-size: 19px;
      cursor: pointer
    }

    .status {
      text-align: center;
      color: #675b7d;
      margin: 0 0 15px;
      font-size: 14px
    }

    @media(max-width:950px) {
      .layout {
        grid-template-columns: 1fr
      }

      .camera-box {
        aspect-ratio: 4 / 3
      }

      header {
        flex-direction: column;
        text-align: center
      }
    }

    .camera-box .a-canvas {
      background: transparent !important;
    }

    .camera-box>a-scene {
      background: transparent !important;
    }

    .camera-box>video.ar-camera-video {
      z-index: 1 !important;
    }

    .camera-box>a-scene {
      z-index: 2 !important;
    }

    #handheldProps {
      position: absolute;
      right: 1%;
      bottom: -5px;
      width: clamp(135px, 31%, 245px);
      height: 90%;
      z-index: 8;
      pointer-events: none;
      overflow: hidden
    }

    .held-prop {
      display: none;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 10px #160e3380);
      transform-origin: 50% 90%;
      animation: heldFloat 3.5s ease-in-out infinite
    }

    #handheldProps[data-filter="king"] #kingProp,
    #handheldProps[data-filter="witch"] #witchProp {
      display: block
    }

    @keyframes heldFloat {

      0%,
      100% {
        transform: translateY(0) rotate(-1deg)
      }

      50% {
        transform: translateY(-5px) rotate(1deg)
      }
    }

    @media(max-width:600px) {
      #handheldProps {
        width: 36%;
        height: 75%;
        right: 0
      }
    }
  </style>
</head>

  <script>
    const scene = document.querySelector('a-scene');
    const cameraBox = document.querySelector('#cameraBox');
    const statusText = document.querySelector('#statusText');


    const mouthStars = document.querySelector('#mouthStars');
    const blinkSparkles = document.querySelector('#blinkSparkles');
    let faceDetected = false;
    let lastBlinkTime = 0;
    let blinkTimer = null;

    const groups = {
      glasses: ['rapperGlasses'],
      king: ['kingFilter'],
      witch: ['witchFilter'],
      rabbit: ['rabbitFilter', 'rabbitNose', 'rabbitMouth'],
      none: []
    };
    const allIds = [...new Set(Object.values(groups).flat())];
    const originalColors = new Map();
    document.querySelectorAll('a-scene [color]').forEach(el => {
      originalColors.set(el, el.getAttribute('color'));
    });
    const initialPositions = new Map();
    let currentFilter = 'glasses';
    const currentSize = 1;
    const offsetX = 0;
    const offsetY = 0;
    let cameraStarted = false;
    let cameraStarting = false;

    function updateTransform() {
      allIds.forEach(id => {
        const element = document.getElementById(id);
        if (!element) return;
        const content = element.classList.contains('filter-content')
          ? element : element.querySelector('.filter-content');
        if (!content) return;
        if (!initialPositions.has(id)) {
          initialPositions.set(id, content.object3D.position.clone());
        }
        const base = initialPositions.get(id);
        content.object3D.scale.setScalar(currentSize * Number(content.dataset.baseScale || 1));
        content.object3D.position.set(base.x + offsetX, base.y + offsetY, base.z);
      });
    }

    function showFilter(name) {
      currentFilter = name;
      document.getElementById('handheldProps').dataset.filter = name;
      allIds.forEach(id => {
        const visible = groups[name].includes(id);
        document.getElementById(id).setAttribute('visible', visible);
      });
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === name);
      });
      if (name === 'rabbit') { mouthStars.setAttribute('visible', false); mouthStars.object3D.visible = false; }
      updateTransform();
      if (cameraStarted) statusText.textContent = 'フィルター: ' + name;
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => showFilter(btn.dataset.filter));
    });

    function waitForScene() {
      if (scene.hasLoaded) return Promise.resolve();
      return new Promise(resolve => scene.addEventListener('loaded', resolve, { once: true }));
    }

    function getCameraVideo() {
      return [...document.querySelectorAll('video')].find(v =>
        v.srcObject && v.srcObject.getVideoTracks().length > 0
      ) || [...document.querySelectorAll('video')].find(v => v.videoWidth > 0);
    }

    function fixCameraVideo() {
      const video = getCameraVideo();
      if (!video) return false;
      if (video.parentElement !== cameraBox) cameraBox.insertBefore(video, scene);
      video.classList.add('ar-camera-video');
      if (video.videoWidth && video.videoHeight) {
        cameraBox.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
      }
      scene.object3D.background = null;
      if (scene.renderer) scene.renderer.setClearColor(0x000000, 0);
      video.style.setProperty('display', 'block', 'important');
      video.style.setProperty('visibility', 'visible', 'important');
      video.style.setProperty('opacity', '1', 'important');
      if (video.paused) video.play().catch(console.warn);
      return true;
    }

    async function startFaceTracking() {
      if (cameraStarted || cameraStarting) return;
      cameraStarting = true;
      statusText.textContent = 'カメラを起動しています...';
      try {
        await waitForScene();
        const mindar = scene.systems['mindar-face-system'];
        if (!mindar) throw new Error('MindAR system not found');
        await mindar.start();
        attachExpressionTracking(mindar);

        scene.object3D.background = null;
        scene.renderer.setClearColor(0x000000, 0);
        scene.renderer.domElement.style.background = 'transparent';
        fixCameraVideo();
        setTimeout(fixCameraVideo, 400);
        setTimeout(fixCameraVideo, 1200);
        cameraStarted = true;
        statusText.textContent = '顔をカメラに向けてください';
      } catch (error) {
        console.error('MindAR Start Error:', error);
        statusText.textContent = 'カメラ起動エラー: ' + error.message;
      } finally {
        cameraStarting = false;
      }
    }

    scene.addEventListener('targetFound', () => {
      faceDetected = true;
      statusText.textContent = '顔を認識しました！';
    });
    scene.addEventListener('targetLost', () => {
      faceDetected = false;
      mouthStars.setAttribute('visible', false);
      blinkSparkles.setAttribute('visible', false);
      statusText.textContent = '顔をカメラに向けてください';
    });
    scene.addEventListener('arError', () => {
      statusText.textContent = 'ARエラー: カメラの設定を確認してください';
    });



    function landmarkDistance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function readLandmarks(data) {
      const result = data?.estimateResult || data?.result || data;
      const candidates = [
        result?.faceLandmarks,
        result?.landmarks,
        result?.metricLandmarks,
        result?.faceMesh,
        result?.faces?.[0]?.landmarks,
        result?.faces?.[0]?.faceLandmarks
      ];
      for (let points of candidates) {
        if (!points) continue;
        if (Array.isArray(points) && Array.isArray(points[0])) points = points[0];
        if (Array.isArray(points) && points.length >= 468 && points[13]?.x !== undefined) return points;
      }
      return null;
    }

    let lastExpressionFrame = 0;
    let wasEyesClosed = false;
    let expressionFrames = 0;

    function processExpressions(data) {
      const points = readLandmarks(data);
      if (!points) {
        if (expressionFrames === 0) document.querySelector('#expressionStatus').textContent = '表情データを待っています...';
        return;
      }
      const now = performance.now();
      if (now - lastExpressionFrame < 110) return;
      lastExpressionFrame = now;
      expressionFrames++;

      const mouthWidth = landmarkDistance(points[61], points[291]);
      const mouthGap = landmarkDistance(points[13], points[14]);
      const mouthRatio = mouthGap / Math.max(mouthWidth, 0.00001);
      const open = mouthRatio > 0.18;
      mouthStars.setAttribute('visible', open && currentFilter !== 'rabbit');
      mouthStars.object3D.visible = open && currentFilter !== 'rabbit';
      const leftWidth = landmarkDistance(points[33], points[133]);
      const rightWidth = landmarkDistance(points[362], points[263]);
      const leftGap = landmarkDistance(points[159], points[145]);
      const rightGap = landmarkDistance(points[386], points[374]);
      const leftRatio = leftGap / Math.max(leftWidth, 0.00001);
      const rightRatio = rightGap / Math.max(rightWidth, 0.00001);
      const closed = leftRatio < 0.19 && rightRatio < 0.19;

      if (closed && !wasEyesClosed && now - lastBlinkTime > 650) {
        lastBlinkTime = now;
        blinkSparkles.setAttribute('visible', true);
        blinkSparkles.object3D.visible = true;
        clearTimeout(blinkTimer);
        blinkTimer = setTimeout(() => { blinkSparkles.setAttribute('visible', false); blinkSparkles.object3D.visible = false; }, 800);
      }
      wasEyesClosed = closed;

      const expressionStatus = document.querySelector('#expressionStatus');
      if (expressionStatus && expressionFrames % 4 === 0) {
        expressionStatus.textContent = `口: ${open ? '開いています ✨' : '閉じています'}  |  目: ${closed ? '閉じています 🌟' : '開いています'}`;
      }
    }

    function attachExpressionTracking(mindar) {
      const controller = mindar.controller;
      if (!controller) {
        document.querySelector('#expressionStatus').textContent = '表情認識: コントローラーが見つかりません';
        return;
      }
      if (controller.__expressionAttached) return;
      const previous = controller.onUpdate;
      controller.onUpdate = function (data) {
        if (typeof previous === 'function') previous.call(this, data);
        processExpressions(data);
      };
      controller.__expressionAttached = true;
      document.querySelector('#expressionStatus').textContent = '表情認識: 顔をカメラに向けてください';
    }

    let resizeFrame;
    function syncCameraLayout() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        const video = getCameraVideo();
        if (video?.videoWidth && video?.videoHeight) {
          cameraBox.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
        }
        if (scene.renderer && scene.camera) {
          const width = cameraBox.clientWidth;
          const height = cameraBox.clientHeight;
          if (width && height) {
            scene.renderer.setSize(width, height, false);
            if (scene.camera.isPerspectiveCamera) {
              scene.camera.aspect = width / height;
              scene.camera.updateProjectionMatrix();
            }
          }
        }
      });
    }
    window.addEventListener('resize', syncCameraLayout);
    new ResizeObserver(syncCameraLayout).observe(cameraBox);

    window.addEventListener('load', () => {
      updateTransform();
      showFilter('glasses');
      startFaceTracking();
      syncCameraLayout();
    });
  </script>
</body>

</html>
